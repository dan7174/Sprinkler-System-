verification_queue:
  - Applicable Oregon and Silverton codes and water-provider requirements
  - Oregon backflow and cross-connection requirements
  - Regional evapotranspiration source
  - USDA NRCS soil data source
  - Oregon State University Extension horticulture sources
  - Irrigation Association design and audit references
  - Current cross-brand manufacturer data
